<!doctype html><html><head><meta charset="utf-8">
<title>aikit pipeline — capture</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Capture-only page: fixed 900x620, one theme per render (?theme=dark|light),
   no transitions and no CSS animation. Every frame is drawn by __frame(n) so a
   headless capture is deterministic instead of racing the clock. */
:root{
  --bg:#121A23; --panel:#19232E; --panel2:#1F2C38; --line:#2C3B4A; --line2:#3A4C5E;
  --ink:#E8EDF2; --ink2:#94A6B6; --ink3:#6B7E90;
  --brass:#D19A4E; --clean:#5FA88C; --block:#D2694F; --halt:#7E9BC4;
}
html[data-theme="light"]{
  --bg:#F4F5F3; --panel:#FFFFFF; --panel2:#ECEEEA; --line:#D6DAD5; --line2:#BFC6BE;
  --ink:#18212A; --ink2:#5F6E7B; --ink3:#84919C;
  --brass:#9A6A1E; --clean:#2F7259; --block:#AF4426; --halt:#3F5F8C;
}
*{box-sizing:border-box; margin:0; padding:0}
html,body{width:900px; height:620px; overflow:hidden}
body{background:var(--bg); color:var(--ink);
     font-family:"Archivo","Helvetica Neue",Arial,sans-serif; -webkit-font-smoothing:antialiased}
.frame{width:900px; height:620px; padding:18px 22px; display:grid;
       grid-template-rows:auto 1fr; gap:14px}

.bar{display:flex; align-items:baseline; gap:14px; border-bottom:1px solid var(--line);
     padding-bottom:12px}
.brand{font-weight:700; font-size:15px; letter-spacing:-.01em}
.brand span{color:var(--brass)}
.tag{font-family:"JetBrains Mono",monospace; font-size:10.5px; letter-spacing:.13em;
     text-transform:uppercase; color:var(--ink3)}
.bar .right{margin-left:auto; display:flex; align-items:center; gap:12px}
.phase{font-weight:600; font-size:14px}
.pill{font-family:"JetBrains Mono",monospace; font-size:10.5px; letter-spacing:.05em;
      padding:3px 9px; border-radius:20px; border:1px solid currentColor}
.pill.running{color:var(--brass)} .pill.blocked{color:var(--block)}
.pill.clean{color:var(--clean)} .pill.halted{color:var(--halt)}
.meta{font-family:"JetBrains Mono",monospace; font-size:10.5px; color:var(--ink2);
      font-variant-numeric:tabular-nums}
.meta b{color:var(--ink); font-weight:500}

.body{display:grid; grid-template-columns:360px 1fr; gap:22px; min-height:0}
svg{width:356px; height:auto}
.seg{fill:none; stroke:var(--line2); stroke-width:1.6}
.seg.dashed{stroke-dasharray:3 5}
.seg.on{stroke:var(--brass); stroke-width:2.6; stroke-dasharray:7 6}
.nbox{fill:var(--panel2); stroke:var(--line2); stroke-width:1.4}
.nlabel{font-family:"Archivo",sans-serif; font-weight:600; font-size:13.5px;
        letter-spacing:.03em; fill:var(--ink2)}
.nsub{font-family:"JetBrains Mono",monospace; font-size:9.5px; letter-spacing:.04em; fill:var(--ink3)}
.arclabel{font-family:"JetBrains Mono",monospace; font-size:9px; letter-spacing:.08em; fill:var(--ink3)}
.node.active .nbox{fill:color-mix(in srgb, var(--brass) 15%, var(--panel2)); stroke:var(--brass)}
.node.active .nlabel{fill:var(--ink)}
.node.blocked .nbox{fill:color-mix(in srgb, var(--block) 17%, var(--panel2)); stroke:var(--block)}
.node.blocked .nlabel{fill:var(--block)}
.node.clean .nbox{fill:color-mix(in srgb, var(--clean) 16%, var(--panel2)); stroke:var(--clean)}
.node.clean .nlabel{fill:var(--clean)}
.node.halt .nbox{fill:color-mix(in srgb, var(--halt) 17%, var(--panel2)); stroke:var(--halt)}
.node.halt .nlabel{fill:var(--halt)}
.token circle{fill:var(--brass)} .token .halo{fill:var(--brass); opacity:.22}

.term{background:var(--panel); border:1px solid var(--line); border-radius:8px;
      display:flex; flex-direction:column; min-height:0; overflow:hidden}
.chrome{display:flex; align-items:center; gap:7px; padding:9px 13px;
        border-bottom:1px solid var(--line); background:var(--panel2)}
.dot{width:9px; height:9px; border-radius:50%; background:var(--line2)}
.chrome .t{font-family:"JetBrains Mono",monospace; font-size:10.5px; color:var(--ink3);
           margin-left:6px}
.log{flex:1; overflow:hidden; padding:12px 14px; font-family:"JetBrains Mono",monospace;
     font-size:12px; line-height:1.62; display:flex; flex-direction:column; justify-content:flex-end}
.log div{display:grid; grid-template-columns:52px 1fr; gap:11px}
.log .k{color:var(--ink3); text-align:right}
.log .v{color:var(--ink2); word-break:break-word}
.log .ok .v{color:var(--clean)} .log .block .v{color:var(--block)}
.log .halt .v{color:var(--halt)}
.log .cmd .k{color:var(--brass)} .log .cmd .v{color:var(--ink)}
</style></head><body>
<div class="frame">
  <div class="bar">
    <span class="brand">ai<span>kit</span></span>
    <span class="tag">unattended delivery</span>
    <span class="right">
      <span class="meta">milestone <b id="ms">—</b> · round <b id="rd">—</b></span>
      <span class="phase" id="phase">Request</span>
      <span class="pill running" id="pill">running</span>
    </span>
  </div>
  <div class="body">
    <svg viewBox="0 0 480 748" xmlns="http://www.w3.org/2000/svg">
      <path class="seg" id="s1" d="M144,70 L144,122"/>
      <path class="seg" id="s2" d="M144,170 L144,222"/>
      <path class="seg" id="s3" d="M144,270 L144,348"/>
      <path class="seg" id="s4" d="M144,396 L144,452"/>
      <path class="seg" id="s5" d="M144,500 L144,572"/>
      <path class="seg" id="s6" d="M144,620 L144,676"/>
      <path class="seg" id="L1" d="M330,476 C368,476 374,462 374,432 C374,402 368,380 330,380"/>
      <path class="seg" id="L2" d="M330,596 C406,596 416,578 416,486 C416,394 406,364 330,364"/>
      <path class="seg dashed" id="L3" d="M330,700 C440,700 452,676 452,532 C452,388 440,352 330,352"/>
      <path class="seg dashed" id="X1" d="M110,476 C82,476 96,506 96,528"/>
      <path class="seg dashed" id="X2" d="M110,596 C82,596 96,566 96,544"/>
      <g class="node" id="n-stop"><rect class="nbox" x="4" y="512" width="92" height="48" rx="7"/>
        <text class="nlabel" x="50" y="531" text-anchor="middle">STOP</text>
        <text class="nsub" x="50" y="546" text-anchor="middle">report · wait</text></g>
      <g class="node" id="n-request"><rect class="nbox" x="110" y="22" width="220" height="48" rx="7"/>
        <text class="nlabel" x="170" y="51">REQUEST</text></g>
      <g class="node" id="n-plan"><rect class="nbox" x="110" y="122" width="220" height="48" rx="7"/>
        <text class="nlabel" x="170" y="145">PLAN</text>
        <text class="nsub" x="170" y="160">milestones · steps</text></g>
      <g class="node" id="n-gate"><rect class="nbox" x="110" y="222" width="220" height="48" rx="7"/>
        <text class="nlabel" x="170" y="245">OWNER GATE</text>
        <text class="nsub" x="170" y="260">the one human stop</text></g>
      <g class="node" id="n-step"><rect class="nbox" x="110" y="348" width="220" height="48" rx="7"/>
        <text class="nlabel" x="170" y="371">STEP</text>
        <text class="nsub" x="170" y="386">implement · verify</text></g>
      <g class="node" id="n-review"><rect class="nbox" x="110" y="452" width="220" height="48" rx="7"/>
        <text class="nlabel" x="170" y="475">REVIEW LOOP</text>
        <text class="nsub" x="170" y="490">no Write tool</text></g>
      <g class="node" id="n-accept"><rect class="nbox" x="110" y="572" width="220" height="48" rx="7"/>
        <text class="nlabel" x="170" y="595">ACCEPTANCE LOOP</text>
        <text class="nsub" x="170" y="610">no diff</text></g>
      <g class="node" id="n-close"><rect class="nbox" x="110" y="676" width="220" height="48" rx="7"/>
        <text class="nlabel" x="170" y="699">CLOSE</text>
        <text class="nsub" x="170" y="714">✅ plan · PR</text></g>
      <g class="token" id="token" transform="translate(144,46)">
        <circle class="halo" r="11"/><circle r="5.5"/></g>
    </svg>
    <div class="term">
      <div class="chrome"><i class="dot"></i><i class="dot"></i><i class="dot"></i>
        <span class="t">aikit · autopilot</span></div>
      <div class="log" id="log"></div>
    </div>
  </div>
</div>
<script>
const AT={request:46,plan:146,gate:246,step:372,review:476,accept:596,close:700};
// Shorter than the interactive page: one step instead of two. The story the GIF
// has to tell is that BOTH loops go round before anything merges.
const RUN=[
 {at:'request',seg:null,hold:5,phase:'Request',st:'running',ms:'—',rd:'—',
  log:[['$','/aikit:plan  бронь: отмена в разговоре','cmd']]},
 {at:'plan',seg:'s1',hold:9,phase:'Planning',st:'running',
  log:[['plan','docs/PLAN.md · 3 milestones written'],['plan','E57 · приёмка: да']]},
 {at:'gate',seg:'s2',hold:11,phase:'Owner gate',st:'halted',
  log:[['gate','waiting for the owner','halt'],['gate','approved','ok']]},
 {at:'step',seg:'s3',hold:8,phase:'E57.1',st:'running',ms:'E57',
  log:[['step','parser accepts the card block'],['verify','uv run pytest -q → ok','ok']]},
 {at:'review',seg:'s4',hold:11,phase:'Review',st:'blocked',rd:'1 / 3',
  log:[['review','round 1 of 3 · reviewer-strict'],['review','VERDICT: 1 critical, 1 high','block']]},
 {at:'step',seg:'L1',hold:8,phase:'Fix',st:'running',rd:'—',
  log:[['fix','minimal diff, nothing else'],['verify','uv run pytest -q → ok','ok']]},
 {at:'review',seg:'s4',hold:9,phase:'Review',st:'clean',rd:'2 / 3',
  log:[['review','round 2 · a fresh instance'],['review','VERDICT: CLEAN','ok']]},
 {at:'accept',seg:'s5',hold:14,phase:'Acceptance',st:'blocked',rd:'1 / 3',
  log:[['accept','stand up · disposable, seeded empty'],
       ['accept','brief = 4 items. no diff, no file names.'],
       ['accept','не работает — «Сохранить» не жмётся','block'],
       ['gate','verdict gate E57 → exit 1','block']]},
 {at:'step',seg:'L2',hold:8,phase:'Fix',st:'running',rd:'—',
  log:[['fix','the author fixes. the agent only reports.'],['verify','npm run check → ok','ok']]},
 {at:'review',seg:'s4',hold:6,phase:'Review',st:'clean',rd:'1 / 3',log:[['review','VERDICT: CLEAN','ok']]},
 {at:'accept',seg:'s5',hold:11,phase:'Acceptance',st:'clean',rd:'2 / 3',
  log:[['accept','round 2 · the whole run again, fresh agent'],
       ['gate','verdict gate E57 → exit 0','ok'],['accept','ГОДИТСЯ','ok']]},
 {at:'close',seg:'s6',hold:12,phase:'Close',st:'clean',rd:'—',
  log:[['close','verify_all → ok','ok'],['close','✅ E57 · same commit as the work'],
       ['close','PR opened','ok']]},
 {at:'step',seg:'L3',hold:9,phase:'E58',st:'running',ms:'E58',
  log:[['next','E58 · приёмка: нет · no acceptance phase']]},
];
const MOVE=5, LINES=[];              // flattened log, revealed one line at a time
const F=[];                          // one entry per GIF frame
let y=AT.request, ms='—', rd='—', shown=0;
RUN.forEach((s,i)=>{
  if(s.ms) ms=s.ms; if(s.rd) rd=s.rd;
  const from=y, to=AT[s.at]; const base=LINES.length;
  s.log.forEach(l=>LINES.push(l));
  if(i>0) for(let k=1;k<=MOVE;k++)
    F.push({y:from+(to-from)*(k/MOVE), seg:s.seg, dash:-k*5, node:null, lines:base, ms, rd,
            phase:s.phase, st:'running'});
  for(let k=0;k<s.hold;k++)
    F.push({y:to, seg:s.seg, dash:-(MOVE+k)*5, node:'n-'+s.at, cls:s.st,
            lines:Math.min(base+1+Math.floor(k/2), base+s.log.length), ms, rd,
            phase:s.phase, st:s.st});
  y=to;
});
window.__frames=F.length;
const $=id=>document.getElementById(id);
window.__frame=n=>{
  const f=F[n];
  document.querySelectorAll('.node').forEach(e=>e.classList.remove('active','blocked','clean','halt'));
  document.querySelectorAll('.seg').forEach(e=>{e.classList.remove('on'); e.style.strokeDashoffset='';});
  if(f.node) $(f.node).classList.add(f.cls==='blocked'?'blocked':f.cls==='clean'?'clean'
                                    :f.cls==='halted'?'halt':'active');
  if(f.seg){ const p=$(f.seg); p.classList.add('on'); p.style.strokeDashoffset=f.dash; }
  $('token').setAttribute('transform',`translate(144,${f.y.toFixed(1)})`);
  $('phase').textContent=f.phase; $('pill').textContent=f.st; $('pill').className='pill '+f.st;
  $('ms').textContent=f.ms; $('rd').textContent=f.rd;
  const log=$('log'); log.replaceChildren();
  LINES.slice(Math.max(0,f.lines-20), f.lines).forEach(([k,v,kind])=>{
    const d=document.createElement('div'); if(kind) d.className=kind;
    const a=document.createElement('span'); a.className='k'; a.textContent=k;
    const b=document.createElement('span'); b.className='v'; b.textContent=v;
    d.append(a,b); log.append(d);
  });
};
const theme=new URLSearchParams(location.search).get('theme');
if(theme==='light') document.documentElement.setAttribute('data-theme','light');
window.__frame(0);
</script></body></html>
